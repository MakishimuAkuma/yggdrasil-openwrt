name: Build Yggdrasil OpenWrt 25.12 APKs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.5
  FEED_BRANCH: gh-pages
  FEED_ROOT: 25.12

jobs:
  check:
    name: Check Yggdrasil stable release
    runs-on: [self-hosted, Linux, X64]

    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      hash: ${{ steps.check.outputs.hash }}

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          command -v curl
          command -v jq
          command -v git
          command -v sha256sum
          command -v openssl

      - name: Check latest stable Yggdrasil
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Checking Yggdrasil stable releases..."
          release="$(
            curl -fsSL --retry 3 --retry-delay 2 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/yggdrasil-network/yggdrasil-go/releases?per_page=30' |
            jq -er '[.[] | select(.draft == false and .prerelease == false)][0]'
          )"

          tag="$(jq -er '.tag_name' <<<"$release")"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Unexpected stable release tag: $tag"
            exit 1
          fi
          version="${tag#v}"

          current="$(
            sed -n 's/^PKG_VERSION:=//p' yggdrasil/Makefile | head -n 1
          )"
          test -n "$current" || {
            echo "ERROR: PKG_VERSION not found in yggdrasil/Makefile"
            exit 1
          }

          echo "Upstream stable: $version ($tag)"
          echo "Package version: $current"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          release_status="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          )"

          if [ "$current" = "$version" ]; then
            if [ "$release_status" = "200" ]; then
              echo "GitHub Release $tag already exists; nothing to build."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$release_status" != "404" ]; then
              echo "ERROR: Unexpected GitHub Release API status: $release_status"
              exit 1
            fi
            echo "GitHub Release $tag does not exist. Rebuilding."
          elif [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" = "$current" ]; then
            echo "Local package version $current is newer than upstream $version."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "New Yggdrasil version detected: $current -> $version"
          fi

          source_url="https://codeload.github.com/yggdrasil-network/yggdrasil-go/tar.gz/${tag}"
          hash="$(
            curl -fsSL --retry 3 --retry-delay 2 "$source_url" |
            sha256sum | awk '{print $1}'
          )"
          echo "Source SHA256: $hash"

          {
            echo "build=true"
            echo "hash=$hash"
          } >> "$GITHUB_OUTPUT"

  discover:
    name: Discover OpenWrt 25.12.5 architectures
    runs-on: [self-hosted, Linux, X64]
    needs: check
    if: needs.check.outputs.build == 'true'

    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}

    steps:
      - name: Discover supported OpenWrt package architectures
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/packages"
          candidates=(
            arm_cortex-a5_vfpv4
            arm_cortex-a7
            arm_cortex-a7_neon-vfpv4
            arm_cortex-a8_vfpv3
            arm_cortex-a9
            arm_cortex-a9_vfpv3-d16
            arm_cortex-a9_neon
            arm_cortex-a15_neon-vfpv4
            aarch64_cortex-a53
            aarch64_cortex-a72
            aarch64_cortex-a76
            aarch64_generic
            rockchip-armv8
            i386_pentium4
            x86_64
            mips_24kc
            mips_mips32
            mipsel_24kc
            mipsel_24kc_24kf
            mipsel_74kc
            mipsel_mips32
            mips64_octeonplus
            riscv64_generic
            loongarch64_generic
          )

          archs=()
          for arch in "${candidates[@]}"; do
            if curl -fsSI --max-time 15 "${base}/${arch}/" >/dev/null 2>&1; then
              archs+=("$arch")
            else
              echo "Skipping unavailable architecture: $arch"
            fi
          done

          if [ "${#archs[@]}" -eq 0 ]; then
            echo "ERROR: No supported OpenWrt package architectures found."
            exit 1
          fi

          matrix="$(
            printf '%s\n' "${archs[@]}" |
            jq -Rsc '{arch: split("\n") | map(select(length > 0))}'
          )"

          echo "$matrix" | jq .
          {
            echo "matrix=$matrix"
            echo "count=${#archs[@]}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Yggdrasil + LuCI (${{ matrix.arch }})
    needs:
      - check
      - discover
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64]

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.discover.outputs.matrix).arch }}

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update Yggdrasil source version and hash
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          HASH: ${{ needs.check.outputs.hash }}
        run: |
          set -euo pipefail

          source_url="https://codeload.github.com/yggdrasil-network/yggdrasil-go/tar.gz/v${VERSION}?"

          sed -i \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" \
            -e "s#^PKG_SOURCE_URL:=.*#PKG_SOURCE_URL:=${source_url}#" \
            -e "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" \
            yggdrasil/Makefile

          grep -E '^PKG_(NAME|VERSION|RELEASE|SOURCE|SOURCE_URL|BUILD_DIR|HASH):' \
            yggdrasil/Makefile

      - name: Verify package files
        shell: bash
        run: |
          set -euo pipefail
          test -f yggdrasil/Makefile
          test -f yggdrasil/files/yggdrasil.sh
          test -f luci-proto-yggdrasil/Makefile
          test -f luci-proto-yggdrasil/root/usr/libexec/rpcd/luci.yggdrasil
          test -f luci-proto-yggdrasil/root/usr/libexec/rpcd/luci.yggdrasil-jumper
          test -f luci-proto-yggdrasil/root/usr/share/rpcd/acl.d/luci-proto-yggdrasil.json
          test -f luci-proto-yggdrasil/htdocs/luci-static/resources/protocol/yggdrasil.js

      - name: Prepare SDK directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"

      - name: Build Yggdrasil and LuCI packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_VERSION }}
          FEEDNAME: action
          PACKAGES: yggdrasil luci-proto-yggdrasil
          INDEX: 1
          PRIVATE_KEY: ${{ secrets.APK_SIGNING_KEY }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          FEED_DIR: ${{ github.workspace }}
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Collect APKs and architecture feed
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          test -d artifacts/bin
          ygg_apk="$(find artifacts/bin -type f -name 'yggdrasil-*.apk' -print -quit)"
          luci_apk="$(find artifacts/bin -type f -name 'luci-proto-yggdrasil-*.apk' -print -quit)"
          feed_index="$(find artifacts/bin/packages -type f -path '*/action/packages.adb' -print -quit)"

          for item in "$ygg_apk" "$luci_apk" "$feed_index"; do
            if [ -z "$item" ] || [ ! -f "$item" ]; then
              echo "ERROR: Missing build output: ${item:-<empty>}"
              find artifacts/bin -type f \( -name '*.apk' -o -name 'packages.adb' \) -print | sort || true
              exit 1
            fi
          done

          mkdir -p "publish/apk" "publish/feed/${ARCH}"

          # Release asset names are unique per architecture. The feed keeps
          # the original APK filenames so they match the signed packages.adb.
          ygg_base="$(basename "$ygg_apk" .apk)"
          luci_base="$(basename "$luci_apk" .apk)"
          cp "$ygg_apk" "publish/apk/${ygg_base}-${ARCH}.apk"
          cp "$luci_apk" "publish/apk/${luci_base}-${ARCH}.apk"

          cp "$ygg_apk" "publish/feed/${ARCH}/"
          cp "$luci_apk" "publish/feed/${ARCH}/"
          cp "$feed_index" "publish/feed/${ARCH}/packages.adb"

          echo "Collected feed for ${ARCH}:"
          find "publish/feed/${ARCH}" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload architecture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: yggdrasil-artifact-${{ matrix.arch }}
          path: publish/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yggdrasil-logs-${{ matrix.arch }}
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release and APK feed
    needs:
      - check
      - discover
      - build
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: yggdrasil-artifact-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate public APK signing key
        shell: bash
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${APK_SIGNING_KEY:-}"

          printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/yggdrasil-apk-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/yggdrasil-apk-signing-key.pem"
          openssl pkey \
            -in "$RUNNER_TEMP/yggdrasil-apk-signing-key.pem" \
            -pubout \
            -out yggdrasil-feed.pub.pem
          rm -f "$RUNNER_TEMP/yggdrasil-apk-signing-key.pem"
          test -s yggdrasil-feed.pub.pem

      - name: Verify build output
        shell: bash
        env:
          EXPECTED_ARCHS: ${{ needs.discover.outputs.count }}
        run: |
          set -euo pipefail

          expected_apks=$((EXPECTED_ARCHS * 2))
          found_apks="$(find release-artifacts/apk -type f -name '*.apk' | wc -l)"
          echo "Expected release APKs: $expected_apks"
          echo "Found release APKs:    $found_apks"
          test "$found_apks" -eq "$expected_apks"

          for arch in $(echo '${{ needs.discover.outputs.matrix }}' | jq -r '.arch[]'); do
            test -f "release-artifacts/feed/${arch}/packages.adb"
            find "release-artifacts/feed/${arch}" -maxdepth 1 -type f -name '*.apk' | grep -q .
          done

          find release-artifacts -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Yggdrasil ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/apk/*.apk
            yggdrasil-feed.pub.pem
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish OpenWrt APK feed to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          git clone --depth 1 --branch "$FEED_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$work/repo"

          repo="$work/repo"
          mkdir -p "$repo/$FEED_ROOT"

          # Replace only the architecture feed directories published by this
          # workflow; retain unrelated files in the gh-pages branch.
          for arch in $(echo '${{ needs.discover.outputs.matrix }}' | jq -r '.arch[]'); do
            rm -rf "$repo/$FEED_ROOT/$arch"
            mkdir -p "$repo/$FEED_ROOT/$arch"
            cp -a "release-artifacts/feed/${arch}/." "$repo/$FEED_ROOT/$arch/"
          done

          cp yggdrasil-feed.pub.pem "$repo/$FEED_ROOT/yggdrasil-feed.pub.pem"
          touch "$repo/.nojekyll"

          cd "$repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FEED_ROOT" .nojekyll

          if git diff --cached --quiet; then
            echo "Feed is already up to date."
            exit 0
          fi

          git commit -m "Publish Yggdrasil ${{ needs.check.outputs.tag }} APK feed"
          git push origin "$FEED_BRANCH"

  skip:
    name: No new stable release
    runs-on: [self-hosted, Linux, X64]
    needs: check
    if: needs.check.outputs.build != 'true'

    steps:
      - name: Show status
        shell: bash
        run: |
          echo "No new Yggdrasil release needs to be built."
          echo "Latest upstream stable: ${{ needs.check.outputs.version }}"
