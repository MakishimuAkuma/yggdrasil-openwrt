name: Build Yggdrasil OpenWrt APK

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag"
        required: true
        type: string

permissions:
  contents: write

env:
  # OpenWrt release branch (used only for display / checkout references).
  OPENWRT_BRANCH: openwrt-25.12

  # OpenWrt SDK Docker image tag suffix.
  # IMPORTANT: openwrt/sdk images on Docker Hub are tagged as
  # "<arch>-<version>" using the plain release VERSION (e.g. "25.12.4"),
  # NOT the git branch name ("openwrt-25.12"). Using the branch name here
  # produces a tag that does not exist and "docker pull" fails for every
  # matrix job. Update this whenever you bump to a new point release.
  OPENWRT_VERSION: 25.12.4


jobs:

  # ============================================================
  # BUILD YGGDRASIL
  # ============================================================

  build-yggdrasil:
    name: Build Yggdrasil (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        arch:
          - arm_cortex-a7
          - arm_cortex-a9
          - arm_cortex-a15_neon-vfpv4

          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - rockchip-armv8
          - aarch64_generic

          - i386_pentium4
          - x86_64

          - mipsel_24kc
          - mips_mips32
          - mips64_octeonplus

          - riscv64_generic

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1


      # ----------------------------------------------------------
      # Verify package
      # ----------------------------------------------------------

      - name: Verify Yggdrasil package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Package:      Yggdrasil"
          echo "Architecture: ${{ matrix.arch }}"
          echo "OpenWrt:      ${{ env.OPENWRT_BRANCH }} (SDK ${{ env.OPENWRT_VERSION }})"
          echo "========================================"

          test -f yggdrasil/Makefile
          test -f yggdrasil/files/yggdrasil.sh

          echo
          echo "Package metadata:"
          grep -E \
            '^PKG_(NAME|VERSION|RELEASE|SOURCE|SOURCE_URL|SOURCE_SUBDIR|HASH):' \
            yggdrasil/Makefile


      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build OpenWrt Yggdrasil package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_VERSION }}

          FEEDNAME: action
          PACKAGES: yggdrasil

          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1

          BUILD_LOG: 1

          # Verbose compiler/linker output (V=s) so the actual go build
          # error shows up directly in the step log instead of being
          # swallowed by the generic "failed to build" summary.
          V: s


      # ----------------------------------------------------------
      # Upload full build log (always, even on failure)
      # ----------------------------------------------------------

      - name: Upload Yggdrasil build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-build-log-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7


      # ----------------------------------------------------------
      # Find APK
      # ----------------------------------------------------------

      - name: Find Yggdrasil APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find bin \
            -type f \
            -name 'yggdrasil-*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Yggdrasil APK not found"

            echo
            echo "Available APK files:"
            find bin \
              -type f \
              -name '*.apk' \
              -print \
              | sort || true

            exit 1
          fi

          echo
          echo "Found Yggdrasil APK:"
          echo "$APK"

          echo "source=$APK" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Rename APK
      # ----------------------------------------------------------

      - name: Rename Yggdrasil APK
        id: renamed
        shell: bash
        run: |
          set -e

          SOURCE="${{ steps.apk.outputs.source }}"

          DIR="$(dirname "$SOURCE")"
          BASE="$(basename "$SOURCE" .apk)"

          TARGET="${DIR}/${BASE}-${{ matrix.arch }}.apk"

          mv "$SOURCE" "$TARGET"

          echo "Renamed:"
          echo "$TARGET"

          echo "path=$TARGET" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------

      - name: Upload Yggdrasil APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-apk-${{ matrix.arch }}
          path: ${{ steps.renamed.outputs.path }}
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # BUILD LUCI
  # ============================================================

  build-luci:
    name: Build LuCI
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1


      # ----------------------------------------------------------
      # Verify packages
      # ----------------------------------------------------------

      - name: Verify LuCI and Yggdrasil packages
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Packages:"
          echo "  - yggdrasil"
          echo "  - luci-proto-yggdrasil"
          echo "Architecture: x86_64"
          echo "OpenWrt:      ${{ env.OPENWRT_BRANCH }} (SDK ${{ env.OPENWRT_VERSION }})"
          echo "========================================"

          test -f yggdrasil/Makefile
          test -f yggdrasil/files/yggdrasil.sh

          test -f luci-proto-yggdrasil/Makefile

          test -f \
            luci-proto-yggdrasil/root/usr/libexec/rpcd/luci.yggdrasil

          test -f \
            luci-proto-yggdrasil/root/usr/libexec/rpcd/luci.yggdrasil-jumper

          test -f \
            luci-proto-yggdrasil/root/usr/share/rpcd/acl.d/luci-proto-yggdrasil.json

          test -f \
            luci-proto-yggdrasil/htdocs/luci-static/resources/protocol/yggdrasil.js

          echo
          echo "Yggdrasil metadata:"
          grep -E \
            '^PKG_(NAME|VERSION|RELEASE|SOURCE|SOURCE_URL|SOURCE_SUBDIR|HASH):' \
            yggdrasil/Makefile || true

          echo
          echo "LuCI metadata:"
          grep -E \
            '^(LUCI_TITLE|LUCI_DEPENDS|LUCI_PKGARCH|PKG_VERSION|PKG_MAINTAINER):' \
            luci-proto-yggdrasil/Makefile || true


      # ----------------------------------------------------------
      # Build LuCI + Yggdrasil
      # ----------------------------------------------------------

      - name: Build OpenWrt LuCI package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ env.OPENWRT_VERSION }}

          FEEDNAME: action

          # IMPORTANT:
          # Build Yggdrasil together with LuCI.
          #
          # luci-proto-yggdrasil contains:
          #
          #   LUCI_DEPENDS:=+yggdrasil
          #
          # Therefore Yggdrasil must be available in this SDK build.
          PACKAGES: yggdrasil luci-proto-yggdrasil

          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1

          BUILD_LOG: 1

          V: s


      # ----------------------------------------------------------
      # Upload full build log (always, even on failure)
      # ----------------------------------------------------------

      - name: Upload LuCI build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luci-build-log
          path: logs/
          if-no-files-found: ignore
          retention-days: 7


      # ----------------------------------------------------------
      # Find LuCI APK
      # ----------------------------------------------------------

      - name: Find LuCI APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find bin \
            -type f \
            -name 'luci-proto-yggdrasil-*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: LuCI APK not found"

            echo
            echo "Available APK files:"
            find bin \
              -type f \
              -name '*.apk' \
              -print \
              | sort || true

            exit 1
          fi

          echo
          echo "Found LuCI APK:"
          echo "$APK"

          echo "source=$APK" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Upload LuCI artifact
      # ----------------------------------------------------------

      - name: Upload LuCI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-proto-yggdrasil-apk
          path: ${{ steps.apk.outputs.source }}
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # RELEASE
  # ============================================================

  release:
    name: Publish APKs to GitHub Release

    needs:
      - build-yggdrasil
      - build-luci

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Determine Release tag
      # ----------------------------------------------------------

      - name: Determine release tag
        id: release_tag
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -e

          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            TAG="$MANUAL_TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "ERROR: Release tag is empty"
            exit 1
          fi

          echo "Using Release:"
          echo "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Download Yggdrasil artifacts
      # ----------------------------------------------------------

      - name: Download Yggdrasil APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yggdrasil-apk-*
          path: release
          merge-multiple: true


      # ----------------------------------------------------------
      # Download LuCI artifact
      # ----------------------------------------------------------

      - name: Download LuCI APK artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-proto-yggdrasil-apk
          path: release


      # ----------------------------------------------------------
      # List APKs
      # ----------------------------------------------------------

      - name: List APKs
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APKs to upload"
          echo "========================================"

          find release \
            -type f \
            -name '*.apk' \
            -print \
            | sort

          COUNT="$(find release -type f -name '*.apk' | wc -l)"

          echo
          echo "Found $COUNT APK(s)"

          if [ "$COUNT" -ne 14 ]; then
            echo
            echo "ERROR: Expected 14 APKs"
            echo "       13 Yggdrasil + 1 LuCI"

            exit 1
          fi


      # ----------------------------------------------------------
      # Verify expected packages
      # ----------------------------------------------------------

      - name: Verify APK set
        shell: bash
        run: |
          set -e

          EXPECTED_ARCHS="
          arm_cortex-a7
          arm_cortex-a9
          arm_cortex-a15_neon-vfpv4
          aarch64_cortex-a53
          aarch64_cortex-a72
          rockchip-armv8
          aarch64_generic
          i386_pentium4
          x86_64
          mipsel_24kc
          mips_mips32
          mips64_octeonplus
          riscv64_generic
          "

          for ARCH in $EXPECTED_ARCHS; do
            if ! find release \
              -type f \
              -name "yggdrasil-*-${ARCH}.apk" \
              | grep -q .; then

              echo "ERROR: Missing Yggdrasil APK for ${ARCH}"
              exit 1
            fi
          done

          if ! find release \
            -type f \
            -name 'luci-proto-yggdrasil-*.apk' \
            | grep -q .; then

            echo "ERROR: Missing luci-proto-yggdrasil APK"
            exit 1
          fi

          echo
          echo "All expected APKs are present."


      # ----------------------------------------------------------
      # Upload APKs to Release
      # ----------------------------------------------------------

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            release/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
